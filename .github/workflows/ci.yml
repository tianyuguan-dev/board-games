name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BoardGames.sln

      - name: Build
        run: dotnet build BoardGames.sln --no-restore -c Release

      - name: Test
        run: >
          dotnet test BoardGames.Tests/BoardGames.Tests.csproj
          --no-build -c Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BoardGames.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BoardGames.Web/package-lock.json

      - name: Install
        run: npm ci

      # TODO: add `npm run lint` here once the existing ESLint errors are fixed
      - name: Build
        run: npm run build
